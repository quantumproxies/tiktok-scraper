[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-tiktok-scraper"
version = "0.1.0"
description = "TikTok scraper for Python and the command line: public profile stats (followers, likes, videos, bio) and per-video metrics (views, likes, comments, shares, saves, sound, hashtags) as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["tiktok-scraper", "tiktok-api", "tiktok-video-scraper", "tiktok-profile", "tiktok-analytics", "tiktok-data", "social-media-scraper", "influencer-marketing", "web-scraping", "scraper", "python", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
tiktok-scraper = "quanticdata_tiktok_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/tiktok-scraper-api/?utm_source=github&utm_medium=pypi&utm_campaign=tiktok-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/tiktok-scraper"
Issues = "https://github.com/quantumproxies/tiktok-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_tiktok_scraper" = ["spec.json", "py.typed"]
